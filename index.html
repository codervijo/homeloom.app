<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Homeloom" />
    <!-- Per-page title, description, canonical and og:title/description/url are set
         per route via src/seo/Seo.tsx (prerendered into each page's <head>). -->
    <!-- Analytics is initialized in src/analytics/init.ts (guarded, no-ops when unconfigured). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://homeloom.app/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@homeloomapp" />
    <meta name="twitter:image" content="https://homeloom.app/og-image.png" />

    <!-- Sitewide entity graph (appears on every prerendered page). Page-specific
         schema (WebApplication, FAQPage, Article, BreadcrumbList) is emitted per
         route via src/seo/Seo.tsx. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://homeloom.app/#organization",
            "name": "Homeloom",
            "url": "https://homeloom.app/",
            "logo": "https://homeloom.app/favicon.svg",
            "sameAs": ["[VERIFY: add real social/GitHub profile URLs for Homeloom]"]
          },
          {
            "@type": "WebSite",
            "@id": "https://homeloom.app/#website",
            "url": "https://homeloom.app/",
            "name": "Homeloom",
            "description": "The operating system for homeschool families.",
            "publisher": { "@id": "https://homeloom.app/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://homeloom.app/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
